name: Intelligence Source Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan official intelligence sources
        id: scan
        run: node scripts/scan-intelligence.mjs

      - name: Persist source fingerprints and queue
        if: steps.scan.outputs.baseline_count != '0' || steps.scan.outputs.change_count != '0'
        run: |
          git config user.name "datacenter-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-snapshots.json data/intelligence-change-queue.json data/latest-intelligence-changes.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(intel): update official-source fingerprints"
            git push
          fi

      - name: Open verification issue for detected changes
        if: steps.scan.outputs.change_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE_COUNT: ${{ steps.scan.outputs.change_count }}
        run: |
          gh issue create             --title "[Intel] ${CHANGE_COUNT} official source change(s) need verification"             --body-file data/latest-intelligence-changes.md
