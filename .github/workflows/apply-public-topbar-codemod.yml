name: Apply Public Topbar Codemod

on:
  push:
    branches:
      - feature/intelligence-ingestion-v1
    paths:
      - scripts/apply-public-topbar-codemod.mjs
      - .github/workflows/apply-public-topbar-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intelligence-ingestion-v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply codemod
        run: node scripts/apply-public-topbar-codemod.mjs
      - name: Commit transformed public routes
        run: |
          git config user.name "datacenter-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app components lib scripts
          if ! git diff --cached --quiet; then
            git commit -m "refactor: share public topbar and news chyron"
            git push origin HEAD:feature/intelligence-ingestion-v1
          fi
